<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자산배분 백테스트 — IdentiFi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf8f4;--surface:#f2efe9;--surface2:#e8e4db;--border:#dedad0;--border2:#cec9bf;
  --text:#1a1814;--text2:#7a776f;--text3:#b5b2a9;
  --accent-bg:#1a1814;--accent-fg:#f0d99a;
  --green:#2a7c6f;--green-bg:#e1f5ee;--red:#943030;--red-bg:#fae8e8;
  --blue:#2b5ea7;--blue-bg:#e8f0fe;--amber:#b86e1a;--amber-bg:#faeeda;
  --gold:#c4933f;--gold-light:#f0d99a;
  --p1:#185FA5;--p2:#1D9E75;--p3:#D85A30;
  --radius:3px;--radius-lg:5px;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR',serif;--display:'DM Serif Display',serif;
}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.app{display:flex;flex-direction:column;min-height:100vh}
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:.9rem 2rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:1.25rem}
.logo{font-family:var(--display);font-size:18px;color:var(--text);font-weight:400}
.logo span{color:var(--gold);font-style:italic}
.page-title{font-family:var(--serif);font-size:1.05rem;font-weight:500}
.page-sub{font-size:.75rem;color:var(--text2)}
.settings-open-btn{background:var(--accent-bg);color:var(--accent-fg);border:none;border-radius:var(--radius-lg);padding:.65rem 1.25rem;font-size:.875rem;font-family:var(--sans);font-weight:500;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;gap:.5rem}
.settings-open-btn:hover{opacity:.82}
.main{flex:1;padding:2rem;overflow-y:auto}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--text3);text-align:center;gap:1rem}
.empty-icon{font-size:3rem;opacity:.25}
.empty-title{font-size:1.1rem;color:var(--text2);font-family:var(--serif)}
.empty-sub{font-size:.85rem;max-width:340px;line-height:1.7;color:var(--text3)}
.empty-btn{background:var(--accent-bg);color:var(--accent-fg);border:none;border-radius:var(--radius-lg);padding:.75rem 1.5rem;font-size:.875rem;font-family:var(--sans);cursor:pointer;margin-top:.5rem;transition:opacity .2s}
.empty-btn:hover{opacity:.82}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:1rem}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--text2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-steps{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem;min-width:220px}
.loading-step{font-size:.8rem;color:var(--text3);display:flex;align-items:center;gap:.5rem}
.loading-step.done{color:var(--green)}.loading-step.active{color:var(--text2)}
.step-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:90vw;max-width:1000px;height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-header{border-bottom:1px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.modal-tabs{display:flex;gap:.25rem;flex:1}
.modal-tab{background:none;border:none;border-radius:var(--radius);padding:.5rem 1rem;font-size:.875rem;font-family:var(--sans);color:var(--text2);cursor:pointer;transition:background .15s}
.modal-tab:hover{background:var(--surface2)}
.modal-tab.active{background:var(--accent-bg);color:var(--accent-fg)}
.modal-close{background:none;border:none;font-size:1.1rem;color:var(--text3);cursor:pointer;padding:.35rem .5rem;border-radius:var(--radius);line-height:1;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:1.5rem}
.modal-footer{border-top:1px solid var(--border);padding:.9rem 1.5rem;display:flex;gap:.75rem;justify-content:flex-end;flex-shrink:0}
.run-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--radius-lg);padding:.65rem 1.5rem;font-size:.9rem;font-family:var(--sans);font-weight:500;cursor:pointer;transition:opacity .2s}
.run-btn:hover{opacity:.85}
.cancel-btn{background:none;border:1px solid var(--border2);border-radius:var(--radius-lg);padding:.65rem 1.25rem;font-size:.9rem;font-family:var(--sans);color:var(--text2);cursor:pointer;transition:background .15s}
.cancel-btn:hover{background:var(--surface2)}
/* Settings tab */
.settings-section{margin-bottom:1.75rem}
.settings-section-title{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-weight:500;margin-bottom:.9rem}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem}
.settings-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:.85rem}
.field{display:flex;flex-direction:column;gap:.3rem}
.field-label{font-size:.72rem;color:var(--text2)}
.field-select,.field-input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.55rem .7rem;font-size:.875rem;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s;width:100%}
.field-select:focus,.field-input:focus{border-color:var(--border2)}
.field-input{font-family:var(--mono)}
/* Portfolio tab */
.port-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.port-scroll{overflow-x:auto}
.port-table{width:100%;border-collapse:collapse;min-width:560px}
.port-table th,.port-table td{padding:.5rem .6rem;text-align:left;border:1px solid var(--border)}
.port-table thead th{background:var(--surface2);font-size:.78rem;font-weight:500;color:var(--text2)}
.port-table th.port-col{text-align:center;min-width:120px}
.port-name-input{background:none;border:none;font-size:.8rem;font-family:var(--sans);font-weight:500;color:var(--text);width:72px;outline:none;text-align:center;padding:.15rem}
.port-name-input:focus{background:var(--surface);border-radius:2px}
.gear-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:.85rem;padding:.1rem .2rem;border-radius:3px;transition:color .15s;vertical-align:middle}
.gear-btn:hover{color:var(--text)}
.asset-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.4rem .5rem;font-size:.8rem;font-family:var(--sans);color:var(--text);outline:none;width:100%;min-width:180px}
.weight-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.4rem .5rem;font-size:.85rem;font-family:var(--mono);color:var(--text);outline:none;width:100%;text-align:right;transition:border-color .15s}
.weight-input:focus{border-color:var(--border2)}
.port-table tfoot td{font-size:.8rem;font-weight:500;font-family:var(--mono);text-align:center;background:var(--surface2)}
.sum-ok{color:var(--green);background:var(--green-bg)!important}
.sum-bad{color:var(--red);background:var(--red-bg)!important}
.remove-row-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;padding:.1rem .3rem;border-radius:3px;transition:color .15s}
.remove-row-btn:hover{color:var(--red)}
.add-row-btn{margin-top:.75rem;background:none;border:1px dashed var(--border2);border-radius:var(--radius);padding:.5rem 1rem;font-size:.8rem;font-family:var(--sans);color:var(--text2);cursor:pointer;transition:all .15s}
.add-row-btn:hover{border-color:var(--text2);color:var(--text)}
/* Gear popup */
.gear-popup{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:.4rem 0;min-width:180px;z-index:2000;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
.gear-popup.open{display:block}
.gear-item{padding:.5rem 1rem;font-size:.82rem;cursor:pointer;color:var(--text);transition:background .1s;white-space:nowrap;display:flex;align-items:center;justify-content:space-between}
.gear-item:hover{background:var(--surface2)}
.gear-item.danger{color:var(--red)}
.gear-divider{border:none;border-top:1px solid var(--border);margin:.3rem 0}
.gear-category{padding:.4rem 1rem .2rem;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
/* Results */
.results-header{margin-bottom:1.75rem}
.results-title{font-size:1.25rem;font-weight:500;font-family:var(--serif);color:var(--text);margin-bottom:.25rem}
.results-period{font-size:.82rem;color:var(--text3);font-family:var(--mono)}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.section-title{font-size:.875rem;font-weight:500;color:var(--text);margin-bottom:1rem}
.section-sub{font-size:.75rem;color:var(--text3);margin-bottom:.75rem}
.perf-table{width:100%;border-collapse:collapse;font-size:.83rem}
.perf-table th,.perf-table td{padding:.55rem .75rem;text-align:right;border-bottom:1px solid var(--border)}
.perf-table th{font-weight:500;color:var(--text2);background:var(--surface2);text-align:center}
.perf-table td:first-child{text-align:left;color:var(--text2)}
.perf-table th:first-child{text-align:left}
.p1-col{color:var(--p1)!important;font-weight:500}
.p2-col{color:var(--p2)!important;font-weight:500}
.p3-col{color:var(--p3)!important;font-weight:500}
.positive{color:var(--green)}
.negative{color:var(--red)}
.chart-wrap{position:relative;width:100%}
.log-toggle{font-size:.75rem;color:var(--text2);background:none;border:1px solid var(--border);border-radius:var(--radius);padding:.3rem .65rem;cursor:pointer;font-family:var(--sans);transition:background .15s}
.log-toggle:hover,.log-toggle.active{background:var(--surface2)}
.legend-row{display:flex;flex-wrap:wrap;gap:.75rem;font-size:.75rem;color:var(--text2)}
.legend-item{display:flex;align-items:center;gap:.35rem}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.crisis-table{width:100%;border-collapse:collapse;font-size:.82rem}
.crisis-table th,.crisis-table td{padding:.5rem .75rem;border-bottom:1px solid var(--border);text-align:right}
.crisis-table th{background:var(--surface2);font-weight:500;color:var(--text2);text-align:center}
.crisis-table td:first-child,.crisis-table th:first-child{text-align:left}
.rolling-table{width:100%;border-collapse:collapse;font-size:.82rem}
.rolling-table th,.rolling-table td{padding:.45rem .65rem;border-bottom:1px solid var(--border);text-align:right}
.rolling-table th{background:var(--surface2);font-weight:500;color:var(--text2);text-align:center;font-size:.78rem}
.rolling-table td:first-child{text-align:left;color:var(--text2)}
.asset-table{width:100%;border-collapse:collapse;font-size:.82rem}
.asset-table th,.asset-table td{padding:.5rem .7rem;border-bottom:1px solid var(--border);text-align:right}
.asset-table th{background:var(--surface2);font-weight:500;color:var(--text2);text-align:center;font-size:.78rem}
.asset-table td:first-child{text-align:left}
.heatmap-scroll{overflow-x:auto}
.heatmap-table{border-collapse:collapse;font-size:.72rem;font-family:var(--mono)}
.heatmap-table th,.heatmap-table td{padding:.4rem .55rem;border:1px solid var(--border);text-align:center;white-space:nowrap}
.heatmap-table th{background:var(--surface2);color:var(--text2);font-weight:500}
.contrib-table{width:100%;border-collapse:collapse;font-size:.82rem}
.contrib-table th,.contrib-table td{padding:.5rem .7rem;border-bottom:1px solid var(--border);text-align:right}
.contrib-table th{background:var(--surface2);font-weight:500;color:var(--text2);font-size:.78rem}
.contrib-table td:first-child{text-align:left}
.port-tab-row{display:flex;gap:.5rem;margin-bottom:.75rem}
.port-tab-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:.35rem .8rem;font-size:.78rem;cursor:pointer;font-family:var(--sans);color:var(--text2);transition:all .15s}
.port-tab-btn.active{background:var(--accent-bg);color:var(--accent-fg);border-color:var(--accent-bg)}
.note-banner{font-size:.75rem;color:var(--amber);background:var(--amber-bg);border-radius:var(--radius);padding:.4rem .75rem;margin-bottom:.75rem;display:flex;align-items:flex-start;gap:.35rem}
.error-banner{background:var(--red-bg);color:var(--red);border-radius:var(--radius);padding:.6rem .9rem;font-size:.82rem;margin-bottom:.75rem}
.disclaimer{font-size:.72rem;color:var(--text3);border-top:1px solid var(--border);padding-top:1rem;margin-top:2rem;line-height:1.8}
@media(max-width:700px){
  .app-header{padding:.75rem 1rem}
  .header-left{gap:.75rem}
  .page-sub{display:none}
  .main{padding:1rem}
  .modal{width:100vw;height:100dvh;border-radius:0}
  .settings-grid{grid-template-columns:1fr 1fr}
  .settings-open-btn span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <div class="logo">Identi<span>Fi</span></div>
      <div>
        <div class="page-title">자산배분 백테스트</div>
        <div class="page-sub">자산군 기반 포트폴리오 장기 시뮬레이션</div>
      </div>
    </div>
    <button class="settings-open-btn" onclick="openModal()">⚙️ <span>포트폴리오 설정</span></button>
  </header>
  <main class="main" id="mainArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◎</div>
      <div class="empty-title">포트폴리오를 설정하고 백테스트를 실행하세요</div>
      <div class="empty-sub">최대 3개 포트폴리오를 동시에 비교합니다<br>한국 자산군과 글로벌 자산군을 자유롭게 조합하세요</div>
      <button class="empty-btn" onclick="openModal()">⚙️ 포트폴리오 설정 열기</button>
    </div>
    <div class="loading-state" id="loadingState" style="display:none">
      <div class="spinner"></div>
      <div style="font-size:.875rem;color:var(--text2)">데이터 수집 중...</div>
      <div class="loading-steps" id="loadingSteps"></div>
    </div>
    <div id="resultsArea" style="display:none"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabBtn-settings" onclick="switchTab('settings')">설정</button>
        <button class="modal-tab" id="tabBtn-assets" onclick="switchTab('assets')">포트폴리오 자산</button>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal()">취소</button>
      <button class="run-btn" onclick="doRunBacktest()">▶ 백테스트 실행</button>
    </div>
  </div>
</div>

<!-- Gear popup -->
<div class="gear-popup" id="gearPopup"></div>

<script>
// ── ECOS API KEY ────────────────────────────────────────────────
const ECOS_API_KEY = 'RSVPYYLHM2SX5A2N181J';

// ── Portfolio colors ───────────────────────────────────────────
const P_COLORS = ['#185FA5','#1D9E75','#D85A30'];
const P_BG     = ['rgba(24,95,165,.12)','rgba(29,158,117,.12)','rgba(216,90,48,.12)'];

// ── Asset class definitions ────────────────────────────────────
const ASSET_DEF = {
  // 국내 주식
  KOSPI_ALL:   {name:'KOSPI 전체',         ticker:'^KS11',     cur:'KRW', grp:'국내 주식'},
  KOSPI_LARGE: {name:'KOSPI 대형주',        ticker:'069500.KS', cur:'KRW', grp:'국내 주식', proxy:'^KS11'},
  KOSPI_SMALL: {name:'KOSPI 소형주(추정)',  ticker:'^KS11',     cur:'KRW', grp:'국내 주식', est:true},
  KOSDAQ:      {name:'코스닥',              ticker:'^KQ11',     cur:'KRW', grp:'국내 주식'},
  KR_DIV:      {name:'국내 배당주',         ticker:'096530.KS', cur:'KRW', grp:'국내 주식', proxy:'^KS11'},
  KR_VALUE:    {name:'국내 가치주(추정)',   ticker:'^KS11',     cur:'KRW', grp:'국내 주식', est:true},
  // 해외 주식 - 미국
  US_TOTAL:    {name:'미국 전체 주식시장',  ticker:'VTI',       cur:'USD', grp:'해외 주식-미국', proxy:'SPY'},
  SP500:       {name:'미국 대형주',          ticker:'^GSPC',     cur:'USD', grp:'해외 주식-미국'},
  US_GROWTH:   {name:'미국 대형 성장주',    ticker:'VUG',       cur:'USD', grp:'해외 주식-미국', proxy:'SPY'},
  US_VALUE:    {name:'미국 대형 가치주',    ticker:'VTV',       cur:'USD', grp:'해외 주식-미국', proxy:'SPY'},
  US_MID:      {name:'미국 중형주',         ticker:'VO',        cur:'USD', grp:'해외 주식-미국', proxy:'SPY'},
  US_SMALL:    {name:'미국 소형주',         ticker:'^RUT',      cur:'USD', grp:'해외 주식-미국'},
  US_SCV:      {name:'미국 소형 가치주',    ticker:'VBR',       cur:'USD', grp:'해외 주식-미국', proxy:'IWM'},
  // 해외 주식 - 글로벌
  INTL_EX_US:  {name:'선진국 주식 (미국 제외)', ticker:'VEA',   cur:'USD', grp:'해외 주식-글로벌', proxy:'EFA'},
  WORLD:       {name:'선진국 주식 (미국 포함)', ticker:'VT',    cur:'USD', grp:'해외 주식-글로벌', proxy:'VTI'},
  EUROPE:      {name:'유럽 주식',           ticker:'VGK',       cur:'USD', grp:'해외 주식-글로벌', proxy:'EFA'},
  JAPAN:       {name:'일본 주식',           ticker:'EWJ',       cur:'USD', grp:'해외 주식-글로벌'},
  EM:          {name:'이머징 마켓',         ticker:'VWO',       cur:'USD', grp:'해외 주식-글로벌', proxy:'EEM'},
  // 국내 채권
  KR_BOND_1Y:  {name:'국내 단기채 (1년)',   ecos:{stat:'817Y002',item:'010200000'}, dur:1,  cur:'KRW', grp:'국내 채권'},
  KR_BOND_3Y:  {name:'국내 중기채 (3년)',   ecos:{stat:'817Y002',item:'010300000'}, dur:3,  cur:'KRW', grp:'국내 채권'},
  KR_BOND_10Y: {name:'국내 장기채 (10년)',  ecos:{stat:'817Y002',item:'010400000'}, dur:10, cur:'KRW', grp:'국내 채권'},
  KR_CORP:     {name:'국내 회사채 (AA-)',   ecos:{stat:'817Y002',item:'020200000'}, dur:3,  cur:'KRW', grp:'국내 채권'},
  // 해외 채권
  US_STB:      {name:'미국 단기국채',       ticker:'SHY',       cur:'USD', grp:'해외 채권'},
  US_MTB:      {name:'미국 중기국채',       ticker:'IEF',       cur:'USD', grp:'해외 채권'},

function assetOptions(selectedId){

function applyEqual(){
  const pi = gearTarget;
  const activeRows = state.rows.filter(r=>r.assetId);
  if(!activeRows.length){ closeGearPopup(); return; }
  const w = (100/activeRows.length).toFixed(1);
  state.rows.forEach(r => { if(r.assetId) r.weights[pi] = w; });
  closeGearPopup(); renderPortfolioTab();
}
function applyNormalize(){
  const pi = gearTarget;
  const total = state.rows.reduce((s,r)=>s+(parseFloat(r.weights[pi])||0),0);
  if(!total){ closeGearPopup(); return; }
  state.rows.forEach(r => {
    const w = parseFloat(r.weights[pi])||0;
    r.weights[pi] = w ? parseFloat((w/total*100).toFixed(2)).toString() : '';
  });
  closeGearPopup(); renderPortfolioTab();
}
function applyClear(){
  const pi = gearTarget;
  state.rows.forEach(r => { r.weights[pi] = ''; });
  closeGearPopup(); renderPortfolioTab();
}
function copyFromPortfolio(from){
  const pi = gearTarget;
  state.rows.forEach(r => { r.weights[pi] = r.weights[from]; });
  closeGearPopup(); renderPortfolioTab();
}
function applyPreset(name){
  const pi = gearTarget;
  const preset = PRESETS[name];
  if(!preset){ closeGearPopup(); return; }
  // Reset weights for this portfolio
  state.rows.forEach(r => { r.weights[pi] = ''; });
  // Apply preset rows
  preset.rows.forEach(([assetId, w]) => {
    let row = state.rows.find(r => r.assetId === assetId);
    if(!row){
      // Find empty row or add new one
      row = state.rows.find(r => !r.assetId);
      if(!row){
        if(state.rows.length >= 10){ return; }
        row = {assetId:'', weights:['','','']};
        state.rows.push(row);
      }
      row.assetId = assetId;
    }
    row.weights[pi] = w.toString();
  });
  closeGearPopup(); renderPortfolioTab();
}

// ── Data fetching ──────────────────────────────────────────────
const PROXIES = [
  u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://thingproxy.freeboard.io/fetch/${u}`,
  u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];
let _wpi = -1;

async function tryFetch(url, makeProxy){
  const pu = makeProxy ? makeProxy(url) : url;
  const r = await fetch(pu, {signal:AbortSignal.timeout(9000)});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const text = await r.text();
  if(!text || text.trim().startsWith('<')) throw new Error('HTML response');
  const parsed = JSON.parse(text);
  if(parsed.contents){
    const inner = JSON.parse(parsed.contents);
    return inner;
  }
  return parsed;
}

async function yahooFetch(url){
  if(_wpi !== -1){
    try{ return await tryFetch(url, PROXIES[_wpi]); }catch(e){ _wpi=-1; }
  }
  return new Promise((resolve, reject) => {
    const cands = [
      {idx:-1, fn:()=>tryFetch(url,null)},
      ...PROXIES.map((p,i)=>({idx:i, fn:()=>tryFetch(url,p)})),
    ];
    let settled=0, done=false;
    cands.forEach(({idx,fn})=>{
      fn().then(d=>{ if(!done){done=true;_wpi=idx;resolve(d);} })
         .catch(()=>{ settled++; if(settled===cands.length&&!done) reject(new Error('모든 프록시 실패')); });
    });
  });
}

async function fetchYahooPrices(ticker, startYear, endYear){
  const t1 = Math.floor(new Date(`${startYear}-01-01`).getTime()/1000);
  const t2 = Math.floor(new Date(`${endYear}-12-31`).getTime()/1000);
  const urls = [
    `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?period1=${t1}&period2=${t2}&interval=1mo&events=adjclose`,
    `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?period1=${t1}&period2=${t2}&interval=1mo&events=adjclose`,
  ];
  let result = null;
  for(const url of urls){
    try{
      const d = await yahooFetch(url);
      const r = d?.chart?.result?.[0];
      if(r){ result=r; break; }
    }catch(e){}
  }
  if(!result) throw new Error(`${ticker} 데이터 없음`);
  const ts = result.timestamp;
  const closes = result.indicators?.adjclose?.[0]?.adjclose || result.indicators?.quote?.[0]?.close;
  if(!ts||!closes) throw new Error(`${ticker} 데이터 없음`);
  const priceMap = {};
  ts.forEach((t,i)=>{
    if(closes[i]==null) return;
    const d = new Date(t*1000);
    priceMap[`${d.getFullYear()}-${d.getMonth()+1}`] = closes[i];
  });
  const first = new Date(ts[0]*1000);
  return {priceMap, firstYear:first.getFullYear(), firstMonth:first.getMonth()+1};
}

async function fetchECOSData(stat, item, startYear, endYear){
  if(ECOS_API_KEY==='YOUR_ECOS_API_KEY') throw new Error('ECOS API 키 미설정');
  const s = `${startYear}01`, e = `${endYear}12`;
  const url = `https://ecos.bok.or.kr/api/StatisticSearch/${ECOS_API_KEY}/json/kr/1/10000/${stat}/MM/${s}/${e}/${item}`;
  let d = null;
  for(const makeProxy of [null, ...PROXIES]){
    try{
      d = await tryFetch(url, makeProxy);
      if(d?.StatisticSearch?.row?.length) break;
    }catch(e){ d=null; }
  }
  if(!d?.StatisticSearch?.row?.length) throw new Error('ECOS 데이터 없음');
  const rows = d.StatisticSearch.row;
  return rows.map(r=>({
    year: parseInt(r.TIME.slice(0,4)),
    month: parseInt(r.TIME.slice(4,6)),
    value: parseFloat(r.DATA_VALUE),
  })).filter(r=>!isNaN(r.value));
}

// Convert bond yield series → monthly price return series
function yieldToReturnMap(yields, duration){
  const priceMap = {};
  for(let i=1; i<yields.length; i++){
    const py = yields[i-1].value / 100;
    const cy = yields[i].value / 100;
    const modDur = duration / (1 + py);
    const ret = py/12 - modDur*(cy-py);
    const {year,month} = yields[i];
    priceMap[`${year}-${month}`] = ret;
  }
  return priceMap; // key → monthly return (not price)
}

async function fetchAssetData(assetId, startYear, endYear){
  const cacheKey = `${assetId}_${startYear}_${endYear}`;
  if(dataCache.has(cacheKey)) return dataCache.get(cacheKey);

  const def = ASSET_DEF[assetId];
  let data = null;

  if(def.ecos){
    // ECOS-based asset (Korean bonds, cash)
    const yields = await fetchECOSData(def.ecos.stat, def.ecos.item, startYear, endYear);
    if(!yields.length) throw new Error(`${def.name} 데이터 없음`);
    const first = yields[0];
    let priceMap;
    if(def.ecos.isCash){
      priceMap = {};
      yields.forEach((y,i)=>{ if(i>0) priceMap[`${y.year}-${y.month}`] = y.value/100/12; });
    } else {
      priceMap = yieldToReturnMap(yields, def.dur);
    }
    data = {priceMap, firstYear:first.year, firstMonth:first.month, isReturn:true, proxyNote:null};
  } else {
    // Yahoo Finance asset
    try{
      const r = await fetchYahooPrices(def.ticker, startYear, endYear);
      let proxyNote = null;
      // If data starts late and we have a proxy, try to extend
      if(def.proxy && r.firstYear > startYear){
        try{
          const pr = await fetchYahooPrices(def.proxy, startYear, r.firstYear);
          // Stitch: scale proxy prices to match actual at listing
          const listKey = `${r.firstYear}-${r.firstMonth}`;
          const actualFirst = r.priceMap[listKey];
          // Find proxy price at listing
          let proxyAtList = pr.priceMap[listKey];
          if(!proxyAtList){
            // Try adjacent months
            for(let dm=-2;dm<=2;dm++){
              let m=r.firstMonth+dm, y=r.firstYear;
              if(m<1){m+=12;y--;} if(m>12){m-=12;y++;}
              if(pr.priceMap[`${y}-${m}`]){proxyAtList=pr.priceMap[`${y}-${m}`];break;}
            }
          }
          if(actualFirst && proxyAtList){
            const scale = actualFirst / proxyAtList;
            // Add proxy prices before listing
            Object.entries(pr.priceMap).forEach(([k,v])=>{
              const [ky,km] = k.split('-').map(Number);
              if(ky < r.firstYear || (ky===r.firstYear && km < r.firstMonth)){
                r.priceMap[k] = v * scale;
              }
            });
            r.firstYear = pr.firstYear;
            r.firstMonth = pr.firstMonth;
            proxyNote = `상장 전 기간은 ${def.proxy} 데이터로 대체`;
          }
        }catch(e){}
      }
      data = {priceMap:r.priceMap, firstYear:r.firstYear, firstMonth:r.firstMonth, isReturn:false, proxyNote};
    }catch(e){
      throw new Error(`${def.name}: ${e.message}`);
    }
  }
  dataCache.set(cacheKey, data);
  return data;
}

async function fetchFX(startYear, endYear){
  const key = `${startYear}_${endYear}`;
  if(fxCache && fxCache.key===key) return fxCache.map;
  try{
    const r = await fetchYahooPrices('KRW=X', startYear, endYear);
    fxCache = {key, map:r.priceMap};
    return r.priceMap;
  }catch(e){
    return null;
  }
}

// ── Backtest engine ────────────────────────────────────────────
function runEngine(portfolioRows, assetDataMap, fxMap, settings){
  const {startYear, endYear, initialAmount, annualAddition, additionTiming='start', rebalancing} = settings;
  const initKRW = initialAmount * 10000;
  const addKRW   = annualAddition * 10000;

  // Build active assets (assetId, weight, data)
  const assets = portfolioRows
    .filter(r => r.assetId && parseFloat(r.weight)>0 && assetDataMap[r.assetId])
    .map(r => ({id:r.assetId, w:parseFloat(r.weight)/100, data:assetDataMap[r.assetId], def:ASSET_DEF[r.assetId]}));

  if(!assets.length) return null;

  // Normalize weights
  const totalW = assets.reduce((s,a)=>s+a.w,0);
  assets.forEach(a=>a.w/=totalW);

  const getFX = (y,m) => {
    if(!fxMap) return 1350;
    return fxMap[`${y}-${m}`] || fxMap[`${y}-${m-1}`] || fxMap[`${y}-${m+1}`] || 1350;
  };

  // Get price in KRW for an asset at year/month
  const getPrice = (asset, y, m) => {
    const key = `${y}-${m}`;
    const data = asset.data;
    if(data.isReturn) return null; // handled differently
    const p = data.priceMap[key];
    if(p == null) return null;
    if(asset.def.cur === 'USD') return p * getFX(y,m);
    return p;
  };

  // For return-based assets (bonds, cash), get monthly return
  const getReturn = (asset, y, m) => {
    if(!asset.data.isReturn) return null;
    return asset.data.priceMap[`${y}-${m}`] ?? null;
  };

  // Build month list
  const months = [];
  for(let y=startYear; y<=endYear; y++){
    const mMax = y===endYear ? new Date().getMonth()+1 : 12;
    for(let m=1; m<=mMax; m++) months.push({y,m});
  }

  // Holdings: price-based assets → units; return-based → KRW value
  const holdings = {}; // id → {units or value, type}
  let initialized = false;
  let firstDate = null;
  const monthlyValues = [];

  const shouldRebal = (m, idx) => {
    if(rebalancing==='none') return false;
    if(rebalancing==='annual') return m===1;
    if(rebalancing==='semi') return m===1||m===7;
    if(rebalancing==='quarterly') return [1,4,7,10].includes(m);
    return false;
  };

  months.forEach(({y,m}, mi) => {
    // Additional contribution by timing
    if(initialized && addKRW > 0){
      const addThisMonth =
        additionTiming === 'monthly'             ? addKRW :
        additionTiming === 'end'   && m === 12   ? addKRW :
        additionTiming === 'start' && m === 1    ? addKRW : 0;
      if(addThisMonth > 0){
        assets.forEach(a => {
          const add = addThisMonth * a.w;
          if(a.data.isReturn){
            holdings[a.id] = (holdings[a.id]||0) + add;
          } else {
            const p = getPrice(a, y, m);
            if(p) holdings[a.id] = (holdings[a.id]||0) + add/p;
          }
        });
      }
    }

    // Apply monthly return for return-based assets
    if(initialized){
      assets.forEach(a => {
        if(!a.data.isReturn) return;
        const ret = getReturn(a, y, m);
        if(ret !== null && holdings[a.id] != null){
          holdings[a.id] *= (1 + ret);
        }
      });
    }

    // Check which assets have data this month
    const avail = assets.map(a => {
      if(a.data.isReturn) return getReturn(a, y, m) !== null;
      return getPrice(a, y, m) !== null;
    });

    if(!avail.some(Boolean)) return;

    // Initialize
    if(!initialized){
      initialized = true;
      firstDate = {y,m};
      assets.forEach((a,i) => {
        if(!avail[i]) return;
        const alloc = initKRW * a.w;
        if(a.data.isReturn){
          holdings[a.id] = alloc;
        } else {
          const p = getPrice(a, y, m);
          if(p) holdings[a.id] = alloc / p;
        }
      });
    }

    // Compute total portfolio value
    const assetVals = assets.map((a,i) => {
      if(!avail[i] || holdings[a.id] == null) return 0;
      if(a.data.isReturn) return holdings[a.id];
      const p = getPrice(a, y, m);
      return p ? holdings[a.id] * p : 0;
    });
    const total = assetVals.reduce((s,v)=>s+v,0);
    monthlyValues.push({y,m,value:total,assetVals:[...assetVals]});

    // Rebalance
    if(initialized && shouldRebal(m, mi) && total>0){
      assets.forEach((a,i) => {
        if(!avail[i]) return;
        const target = total * a.w;
        if(a.data.isReturn){
          holdings[a.id] = target;
        } else {
          const p = getPrice(a, y, m);
          if(p) holdings[a.id] = target / p;
        }
      });
    }
  });

  if(!monthlyValues.length) return null;

  // Compute metrics
  const iv = monthlyValues[0].value;
  const fv = monthlyValues[monthlyValues.length-1].value;
  const yrs = monthlyValues.length / 12;
  const cagr = yrs > 0 ? (Math.pow(fv/iv, 1/yrs)-1)*100 : 0;

  const mRets = [];
  for(let i=1; i<monthlyValues.length; i++){
    mRets.push((monthlyValues[i].value - monthlyValues[i-1].value) / monthlyValues[i-1].value);
  }
  const avgR = mRets.reduce((s,v)=>s+v,0)/(mRets.length||1);
  const variance = mRets.reduce((s,v)=>s+(v-avgR)**2,0)/(mRets.length||1);
  const annualVol = Math.sqrt(variance)*Math.sqrt(12)*100;

  // Risk-free rate: use average ECOS 1Y bond or default 3%
  const rfRate = 0.03;
  const sharpe = annualVol>0 ? (cagr/100 - rfRate) / (annualVol/100) : 0;

  // Downside deviation (vs 0)
  const negRets = mRets.filter(r=>r<0);
  const downDev = negRets.length ? Math.sqrt(negRets.reduce((s,r)=>s+r**2,0)/mRets.length)*Math.sqrt(12)*100 : 0;
  const sortino = downDev>0 ? (cagr/100 - rfRate) / (downDev/100) : 0;

  // MDD
  let peak = iv, mdd = 0, mddEnd = null;
  monthlyValues.forEach(p => {
    if(p.value>peak) peak=p.value;
    const dd = (peak-p.value)/peak;
    if(dd>mdd){ mdd=dd; mddEnd={y:p.y,m:p.m}; }
  });

  // Annual returns
  const byYear = {};
  monthlyValues.forEach(p => {
    if(!byYear[p.y]) byYear[p.y]={start:p.value, end:p.value};
    else byYear[p.y].end = p.value;
  });
  const annualRets = Object.entries(byYear).map(([yr,{start,end}])=>({
    year:parseInt(yr), ret:(end-start)/start*100
  }));

  // Best/worst year
  const bestYear = annualRets.reduce((a,b)=>a.ret>b.ret?a:b, annualRets[0]);
  const worstYear = annualRets.reduce((a,b)=>a.ret<b.ret?a:b, annualRets[0]);

  // Arithmetic mean
  const arithMean = annualRets.reduce((s,r)=>s+r.ret,0)/annualRets.length;

  return {
    monthlyValues, assets, firstDate, cagr, annualVol, sharpe, sortino, mdd, mddEnd,
    annualRets, bestYear, worstYear, arithMean, downDev,
    totalReturn: (fv-iv)/iv*100, iv, fv, yrs,
  };
}

// ── Crisis periods ─────────────────────────────────────────────
const CRISES = [
  {name:'IMF 외환위기',   s:{y:1997,m:10}, e:{y:1998,m:6}},
  {name:'닷컴버블',       s:{y:2000,m:3},  e:{y:2002,m:10}},
  {name:'카드대란',       s:{y:2003,m:1},  e:{y:2003,m:9}},
  {name:'글로벌 금융위기',s:{y:2007,m:11}, e:{y:2009,m:3}},
  {name:'코로나19',       s:{y:2020,m:1},  e:{y:2020,m:3}},
  {name:'금리인상 충격',  s:{y:2022,m:1},  e:{y:2022,m:9}},
];

function getCrisisReturn(monthlyValues, crisis){
  const sk = crisis.s.y*12+crisis.s.m;
  const ek = crisis.e.y*12+crisis.e.m;
  const sv = monthlyValues.find(p=>p.y*12+p.m>=sk);
  const ev = [...monthlyValues].reverse().find(p=>p.y*12+p.m<=ek);
  if(!sv||!ev) return null;
  return (ev.value-sv.value)/sv.value*100;
}

// Rolling returns
function computeRolling(monthlyValues, years){
  const n = years * 12;
  const results = [];
  for(let i=n; i<monthlyValues.length; i++){
    const sv = monthlyValues[i-n].value;
    const ev = monthlyValues[i].value;
    const ret = (Math.pow(ev/sv, 1/years)-1)*100;
    results.push(ret);
  }
  if(!results.length) return null;
  return {
    avg: results.reduce((s,v)=>s+v,0)/results.length,
    max: Math.max(...results),
    min: Math.min(...results),
    count: results.length,
  };
}

// Correlation matrix
function pearsonCorr(a,b){
  const n=Math.min(a.length,b.length); if(!n) return 0;
  const ma=a.slice(0,n).reduce((s,v)=>s+v,0)/n;
  const mb=b.slice(0,n).reduce((s,v)=>s+v,0)/n;
  let num=0,da=0,db=0;
  for(let i=0;i<n;i++){num+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2;}
  return da&&db?num/Math.sqrt(da*db):0;
}

// ── Run backtest ───────────────────────────────────────────────
async function doRunBacktest(){
  closeModal();

  // Validate
  const s = state.settings;
  if(s.startYear >= s.endYear){ alert('종료 연도는 시작 연도보다 커야 합니다.'); openModal(); return; }

  // Collect active portfolios
  const activePorts = state.portfolios.map((p,pi)=>{
    const rows = state.rows
      .filter(r => r.assetId && parseFloat(r.weights[pi])>0)
      .map(r => ({assetId:r.assetId, weight:parseFloat(r.weights[pi])}));
    const totalW = rows.reduce((s,r)=>s+r.weight,0);
    return {name:p.name, rows, totalW, active: rows.length>0};
  });

  const anyActive = activePorts.some(p=>p.active);
  if(!anyActive){ alert('최소 1개 포트폴리오에 자산을 입력하세요.'); openModal(); switchTab('assets'); return; }

  // Warn about weight sums
  const badPort = activePorts.find(p=>p.active && Math.abs(p.totalW-100)>0.5);
  if(badPort){
    if(!confirm(`${badPort.name}의 비중 합계가 ${badPort.totalW.toFixed(1)}%입니다. 자동으로 정규화하고 계속할까요?`))
      { openModal(); switchTab('assets'); return; }
  }

  showLoading();

  // Collect unique assets
  const uniqueAssets = new Set();
  activePorts.forEach(p => p.rows.forEach(r => uniqueAssets.add(r.assetId)));

  const steps = ['환율 데이터 로딩', ...Array.from(uniqueAssets).map(id=>ASSET_DEF[id]?.name||id), '백테스트 계산'];
  renderLoadingSteps(steps);

  try{
    let stepIdx = 0;
    updateStep(stepIdx++, 'active');
    const fxMap = await fetchFX(s.startYear, s.endYear);
    updateStep(stepIdx-1, 'done');

    const assetDataMap = {};
    const warnings = [];
    for(const assetId of uniqueAssets){
      updateStep(stepIdx++, 'active');
      try{
        assetDataMap[assetId] = await fetchAssetData(assetId, s.startYear, s.endYear);
        if(assetDataMap[assetId].proxyNote) warnings.push(`${ASSET_DEF[assetId].name}: ${assetDataMap[assetId].proxyNote}`);
      }catch(e){
        warnings.push(`${ASSET_DEF[assetId]?.name||assetId}: 데이터 로드 실패 — 제외됨`);
      }
      updateStep(stepIdx-1, 'done');
    }

    updateStep(stepIdx++, 'active');
    const results = activePorts.map((p,pi) => {
      if(!p.active) return null;
      try{
        return runEngine(p.rows, assetDataMap, fxMap, s);
      }catch(e){
        warnings.push(`${p.name}: 계산 오류 — ${e.message}`);
        return null;
      }
    });
    updateStep(stepIdx-1, 'done');

    await new Promise(r=>setTimeout(r,200));
    renderResults(results, activePorts, warnings, s);
  }catch(e){
    hideLoading();
    document.getElementById('emptyState').style.display='none';
    document.getElementById('resultsArea').innerHTML=`<div class="error-banner">오류: ${e.message}</div>`;
    document.getElementById('resultsArea').style.display='block';
  }
}

    ['산술평균 수익률', i=>pct(results[i].arithMean)],

        <tbody>${tRows}</tbody>

  // ── 8. Asset performance ───────────────────────────────────

      const yr0 = r.monthlyValues.length/12;
      const cagr0 = iv0&&fv0&&yr0>0 ? (Math.pow(fv0/iv0,1/yr0)-1)*100 : 0;
      const rets0 = [];

      const vol0 = Math.sqrt(rets0.reduce((s,v)=>s+(v-avg0)**2,0)/(rets0.length||1))*Math.sqrt(12)*100;
      // Annual vals
      const byYr = {};
      r.monthlyValues.forEach((p,mi)=>{ if(vals[mi]>0){ if(!byYr[p.y])byYr[p.y]={s:vals[mi],e:vals[mi]}; else byYr[p.y].e=vals[mi]; } });
      const aRets = Object.entries(byYr).map(([y,{s,e}])=>({y,ret:(e-s)/s*100}));
      const best = aRets.reduce((a,b)=>a.ret>b.ret?a:b,{ret:-Infinity,y:'—'});
      const worst = aRets.reduce((a,b)=>a.ret<b.ret?a:b,{ret:Infinity,y:'—'});
      return `<tr>
        <td>${ASSET_DEF[a.id]?.name||a.id}</td>
        <td class="${cagr0>=0?'positive':'negative'}">${pct(cagr0)}</td>
        <td>${vol0.toFixed(2)}%</td>
        <td>${best.y!=='—'?best.y+'년 '+pct(best.ret):'—'}</td>
        <td>${worst.y!=='—'?worst.y+'년 '+pct(worst.ret):'—'}</td>
      </tr>`;
    }).join('');
    return `<div style="margin-bottom:1.25rem"><div style="font-size:.8rem;font-weight:500;color:${P_COLORS[pi]};margin-bottom:.5rem">${escHtml(ports[pi].name)}</div>
      <table class="asset-table">
        <thead><tr><th style="text-align:left">자산군</th><th>CAGR</th><th>표준편차</th><th>최고 연도</th><th>최저 연도</th></tr></thead>
        <tbody>${assetRows}</tbody>
      </table></div>`;
  }).join('');

  // ── 9. Correlation heatmap ─────────────────────────────────
  const heatmapHTML = results.map((r,pi)=>{
    if(!r || r.assets.length < 2) return '';
    const labels = r.assets.map(a=>ASSET_DEF[a.id]?.name?.slice(0,8)||a.id);
    // Build monthly return series per asset
    const retSeries = r.assets.map((a,ai)=>{
      const vals = r.monthlyValues.map(m=>m.assetVals[ai]);
      const rets = [];
      for(let i=1;i<vals.length;i++) rets.push(vals[i-1]>0?(vals[i]-vals[i-1])/vals[i-1]:0);
      return rets;
    });
    let hRows = `<tr><th></th>${labels.map(l=>`<th>${escHtml(l)}</th>`).join('')}</tr>`;
    labels.forEach((l,i)=>{
      hRows += `<tr><th>${escHtml(l)}</th>`;
      labels.forEach((_,j)=>{
        if(i===j){ hRows+=`<td style="background:var(--surface2);color:var(--text2)">1.00</td>`; return; }
        const c = pearsonCorr(retSeries[i], retSeries[j]);
        const bg = corrColor(c);
        hRows+=`<td style="background:${bg.bg};color:${bg.fg}">${c.toFixed(2)}</td>`;
      });
      hRows += `</tr>`;
    });
    return `<div style="margin-bottom:1.25rem"><div style="font-size:.8rem;font-weight:500;color:${P_COLORS[pi]};margin-bottom:.5rem">${escHtml(ports[pi].name)}</div>
      <div class="heatmap-scroll"><table class="heatmap-table">${hRows}</table></div></div>`;
  }).join('');

  // ── 10. Contribution breakdown ─────────────────────────────
  const contribHTML = results.map((r,pi)=>{
    if(!r) return '';
    const last = r.monthlyValues[r.monthlyValues.length-1];
    const contribRows = r.assets.map((a,ai)=>{
      const finalVal = last.assetVals[ai];
      const share = last.value>0 ? finalVal/last.value*100 : 0;
      return `<tr><td>${ASSET_DEF[a.id]?.name||a.id}</td>
        <td>${(a.w*100).toFixed(1)}%</td>
        <td>${manwon(finalVal)}</td>
        <td>${share.toFixed(1)}%</td></tr>`;
    }).join('');
    return `<div style="margin-bottom:1.25rem"><div style="font-size:.8rem;font-weight:500;color:${P_COLORS[pi]};margin-bottom:.5rem">${escHtml(ports[pi].name)}</div>
      <table class="contrib-table">
        <thead><tr><th style="text-align:left">자산군</th><th>목표비중</th><th>최종가치</th><th>실제비중</th></tr></thead>
        <tbody>${contribRows}</tbody>
      </table></div>`;
  }).join('');

  // ── Assemble HTML ──────────────────────────────────────────
  document.getElementById('resultsArea').innerHTML = `
    <div class="results-header">
      <div class="results-title">백테스트 결과</div>
      <div class="results-period">${periodStr} · ${settings.startYear}–${settings.endYear} 시뮬레이션</div>
      ${warnHTML}
    </div>

    <div class="section-card">
      <div class="section-title">① 성과 요약</div>
      <div style="overflow-x:auto"><table class="perf-table">
        <thead><tr><th>지표</th>${thCols}</tr></thead>
        <tbody>${perfRows}</tbody>
      </table></div>
    </div>

    <div class="section-card">
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>② 포트폴리오 성장 추이</span>
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="log-toggle" id="logToggle" onclick="toggleLog()">로그 스케일</button>
          <div class="legend-row" id="growthLegend"></div>
        </div>
      </div>
      <div class="chart-wrap" style="height:340px"><canvas id="growthChart"></canvas></div>
    </div>

    <div class="section-card">
      <div class="section-title">③ 연도별 수익률</div>
      <div class="chart-wrap" style="height:280px"><canvas id="annualChart"></canvas></div>
    </div>

    <div class="section-card">
      <div class="section-title">④ 리스크 / 수익률 상세 지표</div>
      <div style="overflow-x:auto"><table class="perf-table">
        <thead><tr><th>지표</th>${thCols}</tr></thead>
        <tbody>${riskRows}</tbody>
      </table></div>
    </div>

    <div class="section-card">
      <div class="section-title">⑤ 낙폭 차트</div>
      <div class="chart-wrap" style="height:220px"><canvas id="ddChart"></canvas></div>
    </div>

    <div class="section-card">
      <div class="section-title">⑥ 역사적 위기 구간 성과</div>
      <div style="overflow-x:auto"><table class="crisis-table">
        <thead><tr><th>위기 구간</th>${thCols}</tr></thead>
        <tbody>${crisisRows}</tbody>
      </table></div>
    </div>

    <div class="section-card">
      <div class="section-title">⑦ 롤링 수익률 테이블</div>
      ${rollingHTML}
    </div>

    <div class="section-card">
      <div class="section-title">⑧ 자산별 성과</div>
      ${assetPerfHTML}
    </div>

    <div class="section-card">
      <div class="section-title">⑨ 상관계수 히트맵</div>
      <div class="section-sub">포트폴리오 내 자산군 간 월별 수익률 기반 피어슨 상관계수</div>
      ${heatmapHTML||'<div style="color:var(--text3);font-size:.82rem">자산이 2개 이상인 포트폴리오에서 표시됩니다.</div>'}
    </div>

    <div class="section-card">
      <div class="section-title">⑩ 수익 기여도 분해</div>
      ${contribHTML}
    </div>

    <div class="disclaimer">
      이 도구는 실제 데이터 및 추정치를 기반으로 한 시뮬레이션이며, 미래 수익을 보장하지 않습니다.
      거래 비용·세금·슬리피지는 반영되지 않으며 배당은 수정주가(Adj Close)로 근사 반영됩니다.
      무위험수익률 기준: 연 3.0%. 데이터 출처: Yahoo Finance, 한국은행 ECOS. IdentiFi는 투자 자문업자가 아닙니다.
    </div>`;

  document.getElementById('resultsArea').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';

  // Build charts after DOM is ready
  setTimeout(()=>buildCharts(results, ports, sortedMonths, settings), 80);
}

// ── Charts ─────────────────────────────────────────────────────
let _logScale = false;
function toggleLog(){
  _logScale = !_logScale;
  document.getElementById('logToggle').classList.toggle('active', _logScale);
  // Rebuild growth chart
  const gc = _charts.find(c=>c.canvas?.id==='growthChart');
  if(gc){ gc.options.scales.y.type = _logScale?'logarithmic':'linear'; gc.update(); }
}

function buildCharts(results, ports, sortedMonths, settings){
  const isDark = matchMedia('(prefers-color-scheme:dark)').matches;
  const gc = isDark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)';
  const tc = isDark?'#5C5A54':'#A09E97';
  const chartDefaults = {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{mode:'index',intersect:false}},
  };

  // ── Growth chart (万원 on Y axis) ─────────────────────────
  const growthDatasets = results.map((r,pi)=>{
    if(!r) return null;
    const valMap = {};
    r.monthlyValues.forEach(p=>{ valMap[`${p.y}-${p.m}`]=p.value/10000; });
    return {
      label: ports[pi].name,
      data: sortedMonths.map(k=>valMap[k]??null),
      borderColor: P_COLORS[pi], borderWidth:2, pointRadius:0, tension:.3, fill:false, spanGaps:false,
    };
  }).filter(Boolean);

  const growthCtx = document.getElementById('growthChart');
  if(growthCtx){
    const labels = sortedMonths.map(k=>{ const[y,m]=k.split('-'); return m==='1'?y:''; });
    const c = new Chart(growthCtx, {
      type:'line', data:{labels, datasets:growthDatasets},
      options:{...chartDefaults,
        scales:{
          x:{ticks:{color:tc,font:{size:10,family:'IBM Plex Mono'},autoSkip:true,maxTicksLimit:15},grid:{color:gc}},
          y:{type:'linear',ticks:{color:tc,font:{size:10,family:'IBM Plex Mono'},callback:v=>v.toLocaleString('ko-KR')+'만'},grid:{color:gc}},
        },
        plugins:{...chartDefaults.plugins, tooltip:{...chartDefaults.plugins.tooltip, callbacks:{
          label: ctx=>`${ctx.dataset.label}: ${Math.round(ctx.parsed.y).toLocaleString('ko-KR')}만원`
        }}},
      }
    });
    _charts.push(c);

    // Legend
    const leg = document.getElementById('growthLegend');
    if(leg) leg.innerHTML = growthDatasets.map(d=>`
      <span class="legend-item"><span class="legend-dot" style="background:${d.borderColor}"></span>${escHtml(d.label)}</span>`).join('');
  }

  // ── Annual bar chart ──────────────────────────────────────
  const annualCtx = document.getElementById('annualChart');
  if(annualCtx){
    const allYears = new Set();
    results.forEach(r=>r&&r.annualRets.forEach(a=>allYears.add(a.year)));
    const years = [...allYears].sort();
    const annDatasets = results.map((r,pi)=>{
      if(!r) return null;
      const retMap = {};
      r.annualRets.forEach(a=>{ retMap[a.year]=a.ret; });
      return {
        label:ports[pi].name,
        data: years.map(y=>retMap[y]??null),
        backgroundColor: years.map(y=>{
          const v = retMap[y];
          if(v==null) return 'transparent';
          return v>=0 ? P_COLORS[pi] : P_COLORS[pi]+'88';
        }),
        borderColor: P_COLORS[pi], borderWidth:1,
      };
    }).filter(Boolean);

    const c = new Chart(annualCtx, {
      type:'bar', data:{labels:years, datasets:annDatasets},
      options:{...chartDefaults,
        scales:{
          x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},
          y:{ticks:{color:tc,font:{size:10,family:'IBM Plex Mono'},callback:v=>(v>=0?'+':'')+v+'%'},grid:{color:gc}},
        },
        plugins:{...chartDefaults.plugins, tooltip:{...chartDefaults.plugins.tooltip,callbacks:{
          label:ctx=>`${ctx.dataset.label}: ${pctFmt(ctx.parsed.y)}`
        }}},
      }
    });
    _charts.push(c);
  }

  // ── Drawdown chart ────────────────────────────────────────
  const ddCtx = document.getElementById('ddChart');
  if(ddCtx){
    const ddDatasets = results.map((r,pi)=>{
      if(!r) return null;
      let peak = r.monthlyValues[0].value;
      const ddVals = r.monthlyValues.map(p=>{
        if(p.value>peak) peak=p.value;
        return -((peak-p.value)/peak*100);
      });
      const valMap = {};
      r.monthlyValues.forEach((p,i)=>{ valMap[`${p.y}-${p.m}`]=ddVals[i]; });
      return {
        label:ports[pi].name,
        data:sortedMonths.map(k=>valMap[k]??null),
        borderColor:P_COLORS[pi], borderWidth:1.5, pointRadius:0, tension:.2, fill:true,
        backgroundColor:P_BG[pi], spanGaps:false,
      };
    }).filter(Boolean);

    const labels2 = sortedMonths.map(k=>{ const[y,m]=k.split('-'); return m==='1'?y:''; });
    const c = new Chart(ddCtx, {
      type:'line', data:{labels:labels2, datasets:ddDatasets},
      options:{...chartDefaults,
        scales:{
          x:{ticks:{color:tc,font:{size:10},autoSkip:true,maxTicksLimit:15},grid:{color:gc}},
          y:{ticks:{color:tc,font:{size:10,family:'IBM Plex Mono'},callback:v=>v.toFixed(0)+'%'},grid:{color:gc}},
        },
      }
    });
    _charts.push(c);
  }
}

function pctFmt(v){ return (v>=0?'+':'')+v.toFixed(2)+'%'; }

function corrColor(v){
  if(v>=0.7)  return {bg:'#F5C4B3',fg:'#4A1B0C'};
  if(v>=0.3)  return {bg:'#FAC775',fg:'#412402'};
  if(v>=-0.3) return {bg:'#E1F5EE',fg:'#085041'};
  return {bg:'#B5D4F4',fg:'#042C53'};
}

// ── Loading helpers ────────────────────────────────────────────
function showLoading(){
  document.getElementById('emptyState').style.display='none';
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('loadingState').style.display='flex';
}
function hideLoading(){
  document.getElementById('loadingState').style.display='none';
}
function renderLoadingSteps(steps){
  document.getElementById('loadingSteps').innerHTML = steps.map((s,i)=>
    `<div class="loading-step" id="lstep-${i}"><span class="step-dot"></span>${escHtml(s)}</div>`
  ).join('');
}
function updateStep(i,st){
  const el=document.getElementById(`lstep-${i}`); if(!el) return;
  el.className='loading-step '+st;
  if(st==='done') el.querySelector('.step-dot').style.background='var(--green)';
}

// ── Utilities ──────────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
