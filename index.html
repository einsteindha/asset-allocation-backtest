<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자산배분 백테스트 — IdentiFi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <div class="logo">Identi<span>Fi</span></div>
      <div>
        <div class="page-title">자산배분 백테스트</div>
        <div class="page-sub">자산군 기반 포트폴리오 장기 시뮬레이션</div>
      </div>
    </div>
    <button class="settings-open-btn" onclick="openModal()">⚙️ <span>포트폴리오 설정</span></button>
  </header>
  <main class="main" id="mainArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◎</div>
      <div class="empty-title">포트폴리오를 설정하고 백테스트를 실행하세요</div>
      <div class="empty-sub">최대 3개 포트폴리오를 동시에 비교합니다<br>한국 자산군과 글로벌 자산군을 자유롭게 조합하세요</div>
      <button class="empty-btn" onclick="openModal()">⚙️ 포트폴리오 설정 열기</button>
    </div>
    <div class="loading-state" id="loadingState" style="display:none">
      <div class="spinner"></div>
      <div style="font-size:.875rem;color:var(--text2)">데이터 수집 중...</div>
      <div class="loading-steps" id="loadingSteps"></div>
    </div>
    <div id="resultsArea" style="display:none"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabBtn-settings" onclick="switchTab('settings')">설정</button>
        <button class="modal-tab" id="tabBtn-assets" onclick="switchTab('assets')">포트폴리오 자산</button>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closeModal()">취소</button>
      <button class="run-btn" onclick="doRunBacktest()">▶ 백테스트 실행</button>
    </div>
  </div>
</div>

<!-- Gear popup -->
<div class="gear-popup" id="gearPopup"></div>

<script src="data.js"></script>
<script src="calc.js"></script>
<script src="ui.js"></script>
</body>
</html>
